<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>INDETEC · Datos Hacendarios · Reportes PBI</title>
<meta name="color-scheme" content="light dark">

<link rel="dns-prefetch" href="https://app.powerbi.com">
<link rel="preconnect" href="https://app.powerbi.com" crossorigin>

<style>
:root{--bg:#fff;--fg:#111;--muted:#667;--card:#f6f7fb;--border:#e6e8ef;--accent:#2f6fed}
@media (prefers-color-scheme:dark){
:root{--bg:#0b0d12;--fg:#eaeef8;--muted:#98a0b3;--card:#121621;--border:#22283a;--accent:#6aa7ff}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--border)}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.toolbar{display:grid;grid-template-columns:1fr auto auto;gap:10px;margin-top:12px}
input[type=search]{padding:10px;border:1px solid var(--border);border-radius:10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.title{margin:0;font-size:1rem}
.tag{font-size:.75rem;padding:2px 8px;border:1px solid var(--border);border-radius:999px}
.actions{display:flex;gap:8px;margin-top:auto}
a.btn-link{flex:1;text-align:center;text-decoration:none;border:1px solid var(--border);border-radius:10px;padding:9px}
.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
</style>
</head>

<body>

<header>
<div class="wrap">
<h1>Datos Hacendarios · Reportes Power BI</h1>

<div class="toolbar">
<input id="q" type="search" placeholder="Buscar...">
</div>
</div>
</header>

<main class="wrap">
<div id="grid" class="grid"></div>
</main>

<script>
const WORKER_BASE = "https://indetec-tracker.cdhindetec.workers.dev";

/* ================= REPORTES ================= */
const REPORTS = {
  pronosticos:"Pronósticos",
  impuestos_potenciales:"Impuestos potenciales",
  predial_potencial:"Predial potencial",
  efipem_ingresos:"EFIPEM Ingresos",
  leyes_ingresos:"Leyes de ingresos",
  leyes_impuestos:"Leyes de impuestos",
  impuestos_vig:"Impuestos vigentes",
  derechos_agua:"Derechos de agua",
  efipem_egresos:"EFIPEM egresos",
  presupuesto_egresos:"Presupuesto egresos",
  estado_analitico:"Estado analítico",
  proyecciones:"Proyecciones",
  resultados:"Resultados",
  panorama_hacienda:"Panorama hacienda",
  cp_estatales:"Cuentas estatales",
  cp_municipales:"Cuentas municipales",
  deuda_mun:"Deuda municipal",
  ambiental:"Medio ambiente",
  indicadores:"Indicadores",
  censos_eco:"Censos económicos",
  denue:"DENUE",
  publicaciones:"Publicaciones"
};

/* ================= RENDER ================= */
function render(){
  const grid = document.getElementById("grid");

  grid.innerHTML = Object.keys(REPORTS).map(id => `
    <div class="card">
      <h3 class="title">${REPORTS[id]}</h3>
      <div class="tag">PBI</div>

      <div class="actions">
        <a class="btn-link primary"
           href="#"
           onclick="openReport(event, '${id}')">
          Abrir
        </a>
      </div>
    </div>
  `).join("");
}

/* ================= TRACKING VIA WORKER ================= */
function openReport(e, id){

  e.preventDefault(); // 🔥 correcto (ya no usamos event global)

  const url = `${WORKER_BASE}/go?id=${encodeURIComponent(id)}&src=index`;

  // redirección limpia
  window.location.href = url;

  return false;
}

/* ================= BUSCADOR ================= */
document.getElementById("q").addEventListener("input", (e) => {
  const val = e.target.value.toLowerCase();

  document.querySelectorAll(".card").forEach(card => {
    card.style.display = card.innerText.toLowerCase().includes(val) ? "" : "none";
  });
});

/* ================= INIT ================= */
render();
</script>

</body>
</html>
