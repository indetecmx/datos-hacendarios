<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>INDETEC · Apertura de reporte</title>
<meta name="color-scheme" content="light dark">

<link rel="dns-prefetch" href="https://app.powerbi.com">
<link rel="preconnect" href="https://app.powerbi.com" crossorigin>

<style>
  :root { --bg:#0b0d12; --fg:#eaeef8; --muted:#9aa3b5; --accent:#2f6fed; }
  @media (prefers-color-scheme:light){
    :root { --bg:#f7f9fc; --fg:#0b0d12; --muted:#5b6476; --accent:#2f6fed; }
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:40px; background:var(--bg); color:var(--fg);
    font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    text-align:center;
  }
  h1{font-size:1.25rem;margin:0 0 6px}
  .meta{color:var(--muted);font-size:.95rem}
  .loader{
    border:4px solid rgba(0,0,0,.15);
    border-top:4px solid var(--accent);
    border-radius:50%;
    width:40px;height:40px;
    margin:18px auto;
    animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

<body>
  <h1 id="t">Abriendo reporte…</h1>
  <p id="m" class="meta">Preparando redirección segura</p>
  <div class="loader" role="progressbar"></div>

<script>

/* =========================
   🔥 CONFIG
========================= */
const WORKER_BASE = "https://indetec-tracker.cdhindetec.workers.dev";

/* =========================
   🔥 NOMBRES SOLO UI
========================= */
const NAMES = {
  pronosticos:'Pronósticos',
  impuestos_potenciales:'Impuestos potenciales',
  predial_potencial:'Predial potencial',
  efipem_ingresos:'EFIPEM ingresos',
  leyes_ingresos:'Leyes de ingresos',
  leyes_impuestos:'Leyes de impuestos',
  impuestos_vig:'Impuestos vigentes',
  derechos_agua:'Derechos de agua',
  efipem_egresos:'EFIPEM egresos',
  presupuesto_egresos:'Presupuesto egresos',
  estado_analitico:'Estado analítico',
  proyecciones:'Proyecciones',
  resultados:'Resultados',
  panorama_hacienda:'Panorama hacienda',
  cp_estatales:'Cuentas estatales',
  cp_municipales:'Cuentas municipales',
  deuda_mun:'Deuda municipal',
  ambiental:'Medio ambiente',
  indicadores:'Indicadores',
  censos_eco:'Censos económicos',
  denue:'DENUE',
  publicaciones:'Publicaciones'
};

/* =========================
   🔥 MAIN LOGIC
========================= */
(function(){

  const qs = new URLSearchParams(location.search);

  // SOLO id (evita r conflictivo)
  const id = (qs.get("id") || "").trim();

  // src limpio (si no viene, lo controlamos)
  const src = (qs.get("src") || "go_html").trim();

  const t = document.getElementById("t");
  const m = document.getElementById("m");

  if(!id){
    t.textContent = "ID faltante o inválido";
    m.textContent = "Ejemplo: ?id=publicaciones";
    return;
  }

  const name = NAMES[id] || id;

  t.textContent = "Abriendo reporte…";
  m.textContent = name;

  // 🔥 URL FINAL CONTROLADA
  const url = `${WORKER_BASE}/go?id=${encodeURIComponent(id)}&src=${encodeURIComponent(src)}`;

  // 🔥 pequeño delay UX
  setTimeout(() => {
    location.replace(url);
  }, 80);

})();

</script>
</body>
</html>
